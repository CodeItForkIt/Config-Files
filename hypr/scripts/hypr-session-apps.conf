# hypr-session.sh class->command override map.
#
# One entry per line: Class=command
# - Class is the window class hypr-session.sh saved (run
#   `hypr-session.sh list` after a save to see the real detected values).
# - command is what gets relaunched via `hyprctl dispatch exec`.
# - Use the sentinel value SKIP to never save/restore a class at all
#   (panel overlays, launchers, etc).
# Lines starting with # and blank lines are ignored.
#
# Without an entry here, hypr-session.sh falls back to reading
# /proc/<pid>/cmdline for that window's actual launch command, which works
# for plain binaries but not flatpak/appimage/JVM apps (their real command
# isn't visible from outside the sandbox) — add an override below for those.
#
# Examples below use the real classes already seen in this setup (from
# ~/.local/state/noctalia/settings.toml's dock.pinned list) — uncomment and
# adjust after your first `hypr-session.sh save` + `hypr-session.sh list`:
#
# kitty=kitty
# vivaldi-stable=vivaldi
# nemo=nemo
# steam=steam
# spotify=flatpak run com.spotify.Client

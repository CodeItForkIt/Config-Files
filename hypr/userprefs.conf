# Hyprland User Preferences
# See: https://wiki.hyprland.org/Configuring

########################################
#  INPUT SETTINGS
########################################
input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat 
    # numlock_by_default = true

    touchpad {
        natural_scroll = no
    }
}

########################################
#  GESTURES
########################################
gestures {
    # workspace_swipe = true
    # workspace_swipe_fingers = 3
}

########################################
#  GENERAL SETTINGS
########################################
general {
    border_size = 0
}

decoration:blur {
    enabled = false
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
}

misc {
    enable_swallow = true
}

xwayland {
    use_nearest_neighbor = false
}

########################################
#  ENVIRONMENT VARIABLES
########################################
env = HYPRCURSOR_THEME,Nordzy
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto

########################################
#  EXEC-ONCE / STARTUP APPLICATIONS
########################################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = mpvpaper -o "loop --no-audio --vo=gpu-next" '*' "/home/autometalogolex/Documents/Cosmere Star Chart.mp4"
exec-once = hyprctl reload
exec-once = hyprpm reload
exec-once = hyprctl setcursor Nordzy-hyprcursors-catppuccin-frappe-dark 23
exec-once = ~/.config/hypr/scripts/hyprpanel.sh
exec-once = nvidia-modprobe
exec-once = systemctl --user start hyprpolkitagent
exec-once = sleep 5 & pkill dunst
exec-once = sudo systemctl restart systemd-resolved
exec-once = sunshine
# Startup apps
exec-once = [workspace 1 silent] kitty
exec-once = [workspace 1 silent] vivaldi
exec-once = [workspace 2 silent] flatpak run com.spotify.Client
exec-once = [workspace 3 silent] nautilus
exec-once = steam
exec-once = pkill hyprshell
exec-once = wayle panel start
# exec-once = gamemode.sh  # currently commented
exec-once = ~/.config/hypr/workspace-wallpaper.sh
########################################
#  WINDOW RULES / WORKSPACES
########################################

# Default
windowrule = border_size 0, opacity 1.0, match:class .*
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]
# Special workspace: Games
windowrule = workspace special, fullscreen on, border_size 0, match:class ^(steam_app_.*)$
windowrule = workspace special, match:class ^(Minecraft|minecraft)$, match:title ^(Minecraft)(.*)$
windowrule = workspace special, match:initial_title ^(Minecraft)(.*)$
windowrule = float on, match:title ^(Console window for .+ — Prism Launcher 9\.4)$
windowrule = float on, border_size 0, move (0) (0), size 1920 1000, match:title ^(Download mods — Prism Launcher.*)$
windowrule = workspace special silent, match:class ^(steam)$
windowrule = workspace special silent, match:class ^(HytaleClient)$
windowrule = workspace special silent, match:class ^(com.hypixel.HytaleLauncher)$
# Steam notification toasts (title is "notificationtoasts_<id>_desktop", id changes each time)
windowrule = workspace special silent, match:title ^(notificationtoasts_.*_desktop)$
windowrule = nofocus, match:title ^(notificationtoasts_.*_desktop)$
# Workspace 1
#windowrule = workspace 1, move ((monitor_w*0.5)) (0), size (monitor_w*0.5) (monitor_h*1), match:class ^(kitty)$
#windowrule = workspace 1, move (0) (0), size (monitor_w*0.5) (monitor_h*1), match:class ^(floorp)$

# Workspace 2
windowrule = workspace 2, move (0) (0), size (monitor_w*0.5) (monitor_h*1), match:class ^(spotify)$
windowrule = workspace 2, move ((monitor_w*0.5)) (0), size (monitor_w*0.5) (monitor_h*1), match:class ^(vesktop)$

# Workspace 3
#windowrule = workspace 3, move (0) (0), size (monitor_w*0.5) (monitor_h*1), match:class ^(org.gnome.Nautilus)$
#windowrule = workspace 3, move ((monitor_w*0.5)) (0), size (monitor_w*0.5) (monitor_h*1), match:class ^(org.mozilla.Thunderbird)$

# Workspace 4
#windowrule = workspace 4, match:class ^(thunderbird)$
#windowrule = workspace 4, fullscreen on, match:class ^(obsidian)$

# Empty workspace
windowrule = workspace empty, fullscreen on, match:class ^(foundry)$

# Fullscreen overrides

# Quickemu/QEMU VMs
windowrule = float on, fullscreen on, match:class ^(qemu-system-x86_64|QEMU)$
windowrule = float on, fullscreen on, match:title ^(QEMU)(.*)$

# Opacity

########################################
#  LAYER RULES
########################################
layerrule = animation slide top, blur on, match:namespace notifications
layerrule = animation slide top, blur on, match:namespace hyprpanel-notifications

########################################
#  PERMISSIONS
########################################
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

########################################
# PLUGIN
########################################
# hyprland.conf
# hyprland.conf
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]
windowrule {
	name = oneko
	match:class = oneko
	
	float = true
	no_blur = true
	no_focus = true
	no_shadow = true
	border_size = 0
}
env = WLR_RENDERER_ALLOW_SOFTWARE,1

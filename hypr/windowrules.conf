# See https://wiki.hyprland.org/Configuring/Window-Rules/

# '$&' is a hyde specific shorthand for "override" \\ analogous to a reference
# This symbol indicates that the following values will override the default configuration
$&=override

# idleinhibit rules
windowrule {
  name = windowrule-1
  idle_inhibit = fullscreen
  match:class = ^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$
}

windowrule {
  name = windowrule-2
  idle_inhibit = fullscreen
  match:class = ^(.*[Ss]potify.*)$
}

windowrule {
  name = windowrule-3
  idle_inhibit = fullscreen
  match:class = ^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen.*)$|^(.*vivaldi.*)$
}


# Picture-in-Picture
windowrule {
  name = windowrule-4
  float = on
  keep_aspect_ratio = on
  move = ((monitor_w*0.73)) ((monitor_h*0.72))
  size = (monitor_w*0.25)
  pin = on
  match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
}





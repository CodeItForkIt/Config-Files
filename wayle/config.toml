monitors = []
[modules.cpu]
poll-interval-ms = 2000
temp-sensor = "auto"
format = "{{ percent }}% @ {{ freq_ghz }}GHz {{ temp_c }}°C"
icon-name = "ld-cpu-symbolic"
icon-show = true
label-show = true
icon-bg-color = "blue"
label-color = "blue"
left-click = "kitty -e btop"

[[modules.cpu.thresholds]]
above = 60
icon-color = "status-warning"
label-color = "status-warning"

[[modules.cpu.thresholds]]
above = 85
icon-color = "status-error"
label-color = "status-error"


# ──────────────────────────────────────────────
# RAM module
# ──────────────────────────────────────────────
[modules.ram]
poll-interval-ms = 3000
format = "{{ used_gib }}/{{ total_gib }}GiB"
icon-name = "ld-memory-stick-symbolic"
icon-show = true
label-show = true
icon-bg-color = "green"
label-color = "green"
left-click = "kitty -e btop"

[[modules.ram.thresholds]]
above = 75
icon-color = "status-warning"
label-color = "status-warning"

[[modules.ram.thresholds]]
above = 90
icon-color = "status-error"
label-color = "status-error"


# ──────────────────────────────────────────────
# GPU module (custom — NVIDIA via nvidia-smi)
# ──────────────────────────────────────────────
[[modules.custom]]
id = "gpu"
command = "~/.config/wayle/scripts/gpu-stats.sh"
mode = "poll"
interval-ms = 2000
format = "{{ util }}% {{ vram_used }}GiB {{ temp }}°C"
tooltip-format = "GPU: {{ util }}% util · {{ vram_used }}/{{ vram_total }} GiB VRAM · {{ temp }}°C"
icon-name = "ld-gpu-symbolic"
icon-show = true
label-show = true
icon-bg-color = "mauve"
label-color = "mauve"
left-click = "kitty -e btop"

# Warm up the color as utilization climbs
# class-format drives dynamic CSS classes if you want to style via stylesheet
class-format = "{% if util | int >= 85 %}gpu-hot{% elif util | int >= 60 %}gpu-warm{% else %}gpu-cool{% endif %}"


# ──────────────────────────────────────────────
# Systray
# ──────────────────────────────────────────────
[modules.systray]
icon-scale = 1.0
item-gap = 0.25
internal-padding = 0.5

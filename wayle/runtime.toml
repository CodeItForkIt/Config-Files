[bar]
bg = "transparent"
border-color = "bg-active"
button-border-location = "top"
button-border-width = 0
button-group-opacity = 0
button-group-rounding = "full"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "clock",
    "weather",
    "separator",
    "media",
    "cava",
]
right = [
    "bluetooth",
    "volume",
    "notifications",
]

[[bar.layout.center]]
name = "Windows"
modules = [
    "hyprland-workspaces",
    "window-title",
]

[styling]
theming-monitor = "DLP-1"

[wallpaper]
transition-type = "none"
transition-duration = 0.5

[bar]
bg = "transparent"
border-color = "bg-active"
button-border-location = "top"
button-border-width = 0

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "clock",
    "weather",
    "separator",
    "media",
    "cava",
]
center = [
    "hyprland-workspaces",
    "window-title",
    { name = "group", modules = [] },
]
right = [
    "bluetooth",
    "volume",
    "notifications",
]

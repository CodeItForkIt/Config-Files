include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
 map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no
background_opacity 0
font_size 10.0
window_padding_width 0
 font_family MesloLGS NF
window_padding_width 5
# Remap green → teal/cyan to avoid clashing with storm colors
# color2  #0db9d7
# color10 #0db9d7


# BEGIN_KITTY_FONTS
font_family      family='MesloLGS NF' postscript_name=MesloLGS-NF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

confirm_os_window_close 0
include themes/noctalia.conf
